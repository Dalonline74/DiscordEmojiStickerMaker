name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-apk.yml"
      - "source/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          cat source/verified.part00 source/verified.part01 source/verified.part02 source/verified.part03 | base64 --decode > DiscordEmojiStickerMaker.zip
          echo "5c24501c99e7dc7bf47b29c9e7ec6b93c880d5d4a5515011889e976007b988a5  DiscordEmojiStickerMaker.zip" | sha256sum -c -
          unzip -q DiscordEmojiStickerMaker.zip
          sed -i 's/androidx.core:core-ktx:1.19.0/androidx.core:core-ktx:1.17.0/' DiscordEmojiStickerMaker/app/build.gradle.kts
          grep 'androidx.core:core-ktx' DiscordEmojiStickerMaker/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: DiscordEmojiStickerMaker
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiscordEmojiStickerMaker-debug
          path: DiscordEmojiStickerMaker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
